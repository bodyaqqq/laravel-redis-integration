<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Создать заказ</title>
</head>
<body>
  <h1>Новый заказ</h1>
  <label>Товар: <input id="item" type="text"></label><br><br>
  <label>Количество: <input id="qty" type="number" min="1" value="1"></label><br><br>
  <button id="btn">Создать заказ</button>
  <script>
    const API_URL = 'http://127.0.0.1:8000/api/order';
    document.getElementById('btn').addEventListener('click', async () => {
      const item = document.getElementById('item').value.trim();
      const qty = Number(document.getElementById('qty').value);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ item, qty })
        });
        const data = await res.json();

        if (res.ok) {
          alert('Заказ создан, уведомление отправлено');
        } else {
          alert('Ошибка: ' + (data.message || 'неизвестная ошибка'));
        }
      } catch (e) {
        alert('Не удалось связаться с сервером: ' + e.message);
      }
    });
  </script>
</body>
</html>
